<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  <script src="js/numbersystem.js"></script>
    <style>
      :root { --bg: #000; --bg-card: #0a0a0a; --border: #181818; --border-hover: #333; --text: #fff; --text-muted: #888; --text-dim: #666; --accent: #4ade80; --error: #ef4444; --font-mono: 'Fira Code', 'SF Mono', 'Fira Mono', 'Roboto Mono', monospace; }
      [data-theme="light"] { --bg: #f5f5f5; --bg-card: #fff; --border: #ddd; --border-hover: #bbb; --text: #111; --text-muted: #555; --text-dim: #777; --accent: #16a34a; --error: #d00; }
      body { font-family: var(--font-mono); margin: 0; padding: 1em; background: var(--bg); color: var(--text); }
      .container { max-width: 480px; margin: auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1.75em; }
      h2 { font-size: 1.1rem; font-weight: 700; text-transform: lowercase; letter-spacing: -0.5px; margin-bottom: 1rem; }
      .form-group { margin-bottom: 1em; display: flex; align-items: center; gap: 8px; }
      label { margin-right: 0.5em; min-width: 120px; font-weight: 600; color: var(--text-muted); font-size: 0.85rem; }
      input, select { flex: 1; padding: 0.5em; border-radius: 6px; border: 1px solid var(--border); font-size: 0.85rem; font-family: inherit; background: var(--bg); color: var(--text); transition: border-color 0.2s; }
      input:focus, select:focus { outline: none; border-color: var(--accent); }
      .results { margin-top: 1.5em; }
      .result-row { display: flex; justify-content: space-between; padding: 0.4em 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
      .result-row span:first-child { color: var(--text-muted); }
      .error { color: var(--error); font-size: 0.82rem; margin-bottom: 1em; }
      @media (max-width: 640px) { .container { padding: 1em; } label { min-width: 90px; font-size: 0.8rem; } }
    </style>
    <script>
      function numberSystemConverter() {
        const fromUnit = document.getElementById("numberSystem").value;
        const fromValueRaw = document.getElementById("inputNumberSystem").value.trim();
        const result = NumberSystem_Conversion(fromUnit, fromValueRaw);
        const outputs = {
          binary: "output_binary",
          octal: "output_octal",
          decimal: "output_decimal",
          hexadecimal: "output_hexadecimal"
        };
        if (result.error) {
          document.getElementById("errorMsg").textContent = result.error;
          Object.values(outputs).forEach(id => {
            document.getElementById(id).textContent = "-";
          });
        } else {
          document.getElementById("errorMsg").textContent = "";
          document.getElementById(outputs.binary).textContent = result.binary;
          document.getElementById(outputs.octal).textContent = result.octal;
          document.getElementById(outputs.decimal).textContent = result.decimal;
          document.getElementById(outputs.hexadecimal).textContent = result.hexadecimal;
        }
      }
    </script>
  </head>
  <body onload="numberSystemConverter()">
    <div class="container" role="main">
      <h2>Number System Converter</h2>
      <div id="errorMsg" class="error" aria-live="polite"></div>
      <form autocomplete="off" onsubmit="return false;">
        <div class="form-group">
          <label for="inputNumberSystem">Enter Number:</label>
          <input
            id="inputNumberSystem"
            type="text"
            inputmode="text"
            value="0"
            placeholder="e.g. 1010 or 255 or FF"
            oninput="numberSystemConverter()"
            aria-label="Number value"
            required
          />
        </div>
        <div class="form-group">
          <label for="numberSystem">System:</label>
          <select id="numberSystem" name="numberSystem" onchange="numberSystemConverter()" aria-label="Select number system">
            <option value="binary">Binary</option>
            <option value="octal">Octal</option>
            <option value="decimal">Decimal</option>
            <option value="hexadecimal">Hexadecimal</option>
          </select>
        </div>
      </form>
      <div class="results" aria-label="Conversion results">
        <div class="result-row"><span>Binary:</span> <span id="output_binary">-</span></div>
        <div class="result-row"><span>Octal:</span> <span id="output_octal">-</span></div>
        <div class="result-row"><span>Decimal:</span> <span id="output_decimal">-</span></div>
        <div class="result-row"><span>Hexadecimal:</span> <span id="output_hexadecimal">-</span></div>
      </div>
    </div>
  </body>
  <script>
    if (window.UnitInfo && typeof window.UnitInfo.attachUnitInfoToSelects === 'function') {
      window.UnitInfo.attachUnitInfoToSelects(document);
    }
  </script>
</html>
