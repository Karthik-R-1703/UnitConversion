<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unit conversion — karthik r</title>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-637VVZQT4Y"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-637VVZQT4Y');
    </script>
  <!-- Load all conversion modules globally for tabs -->
  <script src="js/length.js"></script>
  <script src="js/area.js"></script>
  <script src="js/weight.js"></script>
  <script src="js/temperature.js"></script>
  <script src="js/datasize.js"></script>
  <script src="js/numbersystem.js"></script>
  <script src="js/unitInfo.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }

      :root {
        --bg: #000;
        --bg-card: #0a0a0a;
        --border: #181818;
        --border-hover: #333;
        --text: #fff;
        --text-muted: #888;
        --text-dim: #666;
        --text-dimmer: #555;
        --accent: #4ade80;
        --error: #ef4444;
        --font-mono: 'Fira Code', 'SF Mono', 'Fira Mono', 'Roboto Mono', monospace;
      }

      [data-theme="light"] {
        --bg: #f5f5f5;
        --bg-card: #fff;
        --border: #ddd;
        --border-hover: #bbb;
        --text: #111;
        --text-muted: #555;
        --text-dim: #777;
        --text-dimmer: #999;
        --accent: #16a34a;
        --error: #d00;
      }

      body {
        font-family: var(--font-mono);
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      a { color: var(--text); text-decoration: none; }

      .unit-info-btn {
        margin-left: 8px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 0.85em;
        font-family: inherit;
        padding: 0.15em 0.5em;
        transition: border-color 0.2s, color 0.2s;
      }
      .unit-info-btn:hover { border-color: var(--border-hover); color: var(--text); }
      .unit-info-btn:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
      .unit-tooltip {
        background: var(--text);
        color: var(--bg);
        border: 1px solid var(--border-hover);
        padding: 0.4rem 0.7rem;
        border-radius: 6px;
        max-width: 300px;
        font-size: 0.75rem;
        font-family: var(--font-mono);
        z-index: 2000;
      }

      /* Nav */
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 2rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.85rem;
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--bg);
      }
      nav .logo { font-weight: 700; font-size: 1rem; letter-spacing: -0.5px; }
      nav .logo a { color: var(--text); }
      nav .nav-links { display: flex; gap: 1.5rem; align-items: center; }
      nav .nav-links a { color: var(--text-muted); transition: color 0.2s; }
      nav .nav-links a:hover { color: var(--text); }
      .theme-toggle {
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-muted);
        font-size: 0.85rem;
        padding: 0.25rem 0.5rem;
        cursor: pointer;
        font-family: inherit;
        transition: border-color 0.2s, color 0.2s;
        line-height: 1;
      }
      .theme-toggle:hover { border-color: var(--border-hover); color: var(--text); }

      /* Header */
      .wrap { max-width: 960px; margin: 0 auto; padding: 0 2rem; }
      .page-header {
        padding: 3rem 0 2rem;
        text-align: center;
      }
      .page-header h1 {
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        font-weight: 700;
        letter-spacing: -1.5px;
        text-transform: lowercase;
        margin-bottom: 0.5rem;
      }
      .page-header p {
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      /* Tabs */
      .tabs {
        display: flex;
        justify-content: center;
        margin: 0 0 2rem 0;
        gap: 0.5rem;
        flex-wrap: wrap;
        padding: 0 1rem;
      }
      .tab-btn {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.5em 1.4em;
        font-size: 0.82rem;
        color: var(--text-muted);
        cursor: pointer;
        font-weight: 600;
        font-family: inherit;
        transition: border-color 0.2s, color 0.2s;
        outline: none;
        text-transform: lowercase;
      }
      .tab-btn:hover { border-color: var(--border-hover); color: var(--text); }
      .tab-btn.active {
        border-color: var(--accent);
        color: var(--accent);
      }
      .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* Tab content */
      .tab-content {
        display: none;
        max-width: 480px;
        margin: 0 auto 4rem;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 2em;
        min-height: 400px;
        animation: fadeIn 0.3s ease;
      }
      .tab-content.active { display: block; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Footer */
      footer {
        text-align: center;
        padding: 2rem 0;
        border-top: 1px solid var(--border);
        color: var(--text-dimmer);
        font-size: 0.75rem;
      }
      footer a { color: var(--text-dim); transition: color 0.2s; }
      footer a:hover { color: var(--text); }
      .footer-links { display: flex; justify-content: center; gap: 1.5rem; margin-top: 0.5rem; }

      /* Focus */
      a:focus-visible, .tab-btn:focus-visible, .theme-toggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .fade-in { animation: none; opacity: 1; }
        .tab-content { animation: none; }
      }

      /* Mobile */
      @media (max-width: 640px) {
        nav { padding: 1rem; }
        nav .nav-links { gap: 0.8rem; font-size: 0.75rem; }
        .wrap { padding: 0 1rem; }
        .page-header { padding: 2rem 0 1.5rem; }
        .tabs { gap: 0.4rem; }
        .tab-btn { padding: 0.4em 0.9em; font-size: 0.75rem; }
        .tab-content { padding: 1.2em; min-height: 350px; margin-bottom: 3rem; }
        .unit-tooltip { position: absolute; left: 10px !important; top: auto !important; }
      }
    </style>
  </head>
  <body>
    <!-- Nav -->
    <nav>
      <div class="logo"><a href="https://karthik-r-1703.github.io/Karthik-R-1703/">karthik r</a></div>
      <div class="nav-links">
        <a href="https://karthik-r-1703.github.io/Karthik-R-1703/#projects">&larr; portfolio</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">&#9790;</button>
      </div>
    </nav>

    <div class="wrap">
      <header class="page-header">
        <h1>unit conversion</h1>
        <p>convert between units of length, area, weight, data size, temperature, and number systems.</p>
      </header>
    </div>

  <div class="tabs" role="tablist" id="tablist"></div>
  <div id="length-tab" class="tab-content" role="tabpanel" aria-labelledby="tab-length"></div>
  <div id="area-tab" class="tab-content" role="tabpanel" aria-labelledby="tab-area"></div>
  <div id="data-tab" class="tab-content" role="tabpanel" aria-labelledby="tab-data"></div>
  <div id="number-tab" class="tab-content" role="tabpanel" aria-labelledby="tab-number"></div>
  <div id="temperature-tab" class="tab-content" role="tabpanel" aria-labelledby="tab-temperature"></div>
  <div id="weight-tab" class="tab-content" role="tabpanel" aria-labelledby="tab-weight"></div>

    <footer>
      <div>&copy; <span id="year"></span> <a href="https://karthik-r-1703.github.io/Karthik-R-1703/">karthik r</a></div>
      <div class="footer-links">
        <a href="https://github.com/Karthik-R-1703/UnitConversion">github</a>
        <a href="https://karthik-r-1703.github.io/Karthik-R-1703/">portfolio</a>
      </div>
    </footer>

    <noscript>
      <p style="text-align:center;color:#888;padding:2rem;">This site requires JavaScript to function properly.</p>
    </noscript>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();

      // Theme toggle
      const toggle = document.getElementById('themeToggle');
      const saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
      updateToggleIcon();
      toggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'light' ? null : 'light';
        if (next) {
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
        } else {
          document.documentElement.removeAttribute('data-theme');
          localStorage.removeItem('theme');
        }
        updateToggleIcon();
      });
      function updateToggleIcon() {
        toggle.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? '\u2600' : '\u263e';
      }

      // Tab definitions (sorted alphabetically by label)
      const tabDefs = [
        { id: 'area', label: 'Area', file: 'Area.html' },
        { id: 'data', label: 'Data Size', file: 'DataSize.html' },
        { id: 'length', label: 'Length', file: 'Length.html' },
        { id: 'number', label: 'Number System', file: 'NumberSystem.html' },
        { id: 'temperature', label: 'Temperature', file: 'Temperature.html' },
        { id: 'weight', label: 'Weight', file: 'Weight.html' }
      ];

      // Render tabs dynamically
      function renderTabs() {
        const tablist = document.getElementById('tablist');
        tablist.innerHTML = '';
        tabDefs.forEach((tab, idx) => {
          const btn = document.createElement('button');
          btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
          btn.setAttribute('role', 'tab');
          btn.setAttribute('aria-selected', idx === 0 ? 'true' : 'false');
          btn.setAttribute('aria-controls', tab.id + '-tab');
          btn.id = 'tab-' + tab.id;
          btn.textContent = tab.label;
          btn.onclick = () => showTab(tab.id);
          tablist.appendChild(btn);
        });
      }
      renderTabs();

      // Load converter HTML into tabs with error handling and loading indicator
      function loadTabContent(tabId, file) {
        const tabDiv = document.getElementById(tabId + '-tab');
        tabDiv.innerHTML = '<div style="text-align:center;color:var(--text-dimmer);">Loading...</div>';
        fetch(file)
          .then(res => {
            if (!res.ok) {
              throw new Error('Failed to fetch ' + file + ': ' + res.status);
            }
            return res.text();
          })
          .then(html => {
            // Extract <body> content
            const bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
            const bodyContent = bodyMatch && bodyMatch[1].trim() ? bodyMatch[1] : html;
            tabDiv.innerHTML = bodyContent;

            // Extract and inject <style> tags, filtering out :root/body rules that pollute the parent
            const styleRegex = /<style[^>]*>([\s\S]*?)<\/style>/gi;
            let styleMatch;
            while ((styleMatch = styleRegex.exec(html)) !== null) {
              let css = styleMatch[1];
              // Remove :root, [data-theme], and body rules — the parent page defines these
              css = css.replace(/:root\s*\{[^}]*\}/g, '');
              css = css.replace(/\[data-theme[^\]]*\]\s*\{[^}]*\}/g, '');
              css = css.replace(/body\s*\{[^}]*\}/g, '');
              css = css.trim();
              if (css) {
                const styleTag = document.createElement('style');
                styleTag.textContent = css;
                tabDiv.appendChild(styleTag);
              }
            }

            // Extract and execute only the inline converter function scripts (skip <script src="..."> and UnitInfo scripts)
            const scriptRegex = /<script(?:\s[^>]*)?>(?!\s*$)([\s\S]*?)<\/script>/gi;
            let scriptMatch;
            while ((scriptMatch = scriptRegex.exec(html)) !== null) {
              const scriptContent = scriptMatch[1].trim();
              // Skip empty scripts, external src scripts, and the UnitInfo attachment script
              if (!scriptContent || scriptMatch[0].includes(' src=') || scriptContent.includes('UnitInfo')) continue;
              const scriptTag = document.createElement('script');
              scriptTag.text = scriptContent;
              tabDiv.appendChild(scriptTag);
            }

            // Attach unit info buttons scoped to this tab (before ID scoping so filters match original IDs)
            try {
              if (window.UnitInfo && typeof window.UnitInfo.attachUnitInfoToSelects === 'function') {
                window.UnitInfo.attachUnitInfoToSelects(tabDiv);
              }
            } catch (e) { console.error('UnitInfo attach failed', e); }

            // Scope all converter functions to query within their tab container
            scopeConverterToTab(tabDiv, tabId);

            // Call the relevant converter function after content and scripts are loaded
            setTimeout(() => {
              if (tabId === 'length' && typeof lengthConverter === 'function') lengthConverter();
              if (tabId === 'area' && typeof areaConverter === 'function') areaConverter();
              if (tabId === 'weight' && typeof weightConverter === 'function') weightConverter();
              if (tabId === 'data' && typeof dataSizeConverter === 'function') dataSizeConverter();
              if (tabId === 'temperature' && typeof temperatureConverter === 'function') temperatureConverter();
              if (tabId === 'number' && typeof numberSystemConverter === 'function') numberSystemConverter();
            }, 0);
          })
          .catch(err => {
            tabDiv.innerHTML = '<div style="text-align:center;color:var(--error);">Error loading ' + file + '.</div>';
            console.error('Error loading', file, err);
          });
      }

      // Make all getElementById calls within converter functions scoped to the tab container
      function scopeConverterToTab(tabDiv, tabId) {
        // Give each element with an id inside the tab a tab-scoped id
        const allWithId = tabDiv.querySelectorAll('[id]');
        allWithId.forEach(el => {
          const originalId = el.id;
          el.setAttribute('data-original-id', originalId);
          el.id = tabId + '_' + originalId;
        });

        // Rewrite the converter function to look up scoped IDs within the tab
        const converterMap = {
          length: 'lengthConverter',
          area: 'areaConverter',
          weight: 'weightConverter',
          data: 'dataSizeConverter',
          temperature: 'temperatureConverter',
          number: 'numberSystemConverter'
        };

        const fnName = converterMap[tabId];
        if (!fnName || typeof window[fnName] !== 'function') return;

        const originalFn = window[fnName];
        window[fnName] = function() {
          // Temporarily monkey-patch document.getElementById to scope to this tab
          const origGetById = document.getElementById;
          document.getElementById = function(id) {
            return origGetById.call(document, tabId + '_' + id) || origGetById.call(document, id);
          };
          try {
            originalFn();
          } finally {
            document.getElementById = origGetById;
          }
        };
      }

      // Load all tab contents
      tabDefs.forEach(tab => loadTabContent(tab.id, tab.file));

      // Tab switching logic
      function showTab(tabId) {
        tabDefs.forEach(tab => {
          document.getElementById(tab.id + '-tab').classList.remove('active');
          const btn = document.querySelector('.tab-btn[aria-controls="' + tab.id + '-tab"]');
          btn.classList.remove('active');
          btn.setAttribute('aria-selected', 'false');
        });
        document.getElementById(tabId + '-tab').classList.add('active');
        const activeBtn = document.querySelector('.tab-btn[aria-controls="' + tabId + '-tab"]');
        activeBtn.classList.add('active');
        activeBtn.setAttribute('aria-selected', 'true');
      }
      // Set first tab as active on load
      showTab(tabDefs[0].id);
    </script>
  </body>
</html>
