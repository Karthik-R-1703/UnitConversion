<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  <script src="js/weight.js"></script>
    <style>
      :root { --bg: #000; --bg-card: #0a0a0a; --border: #181818; --border-hover: #333; --text: #fff; --text-muted: #888; --text-dim: #666; --accent: #4ade80; --error: #ef4444; --font-mono: 'Fira Code', 'SF Mono', 'Fira Mono', 'Roboto Mono', monospace; }
      [data-theme="light"] { --bg: #f5f5f5; --bg-card: #fff; --border: #ddd; --border-hover: #bbb; --text: #111; --text-muted: #555; --text-dim: #777; --accent: #16a34a; --error: #d00; }
      body { font-family: var(--font-mono); margin: 0; padding: 1em; background: var(--bg); color: var(--text); }
      .container { max-width: 480px; margin: auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1.75em; }
      h2 { font-size: 1.1rem; font-weight: 700; text-transform: lowercase; letter-spacing: -0.5px; margin-bottom: 1rem; }
      .form-group { margin-bottom: 1em; display: flex; align-items: center; gap: 8px; }
      label { margin-right: 0.5em; min-width: 120px; font-weight: 600; color: var(--text-muted); font-size: 0.85rem; }
      input, select { flex: 1; padding: 0.5em; border-radius: 6px; border: 1px solid var(--border); font-size: 0.85rem; font-family: inherit; background: var(--bg); color: var(--text); transition: border-color 0.2s; }
      input:focus, select:focus { outline: none; border-color: var(--accent); }
      .results { margin-top: 1.5em; }
      .result-row { display: flex; justify-content: space-between; padding: 0.4em 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
      .result-row span:first-child { color: var(--text-muted); }
      .error { color: var(--error); font-size: 0.82rem; margin-bottom: 1em; }
      @media (max-width: 640px) { .container { padding: 1em; } label { min-width: 90px; font-size: 0.8rem; } }
    </style>
    <script>
      function weightConverter() {
        const unitDropDown = document.getElementById("unitWeight");
        const fromUnit = unitDropDown.value;
        const fromValueRaw = document.getElementById("inputWeightUnit").value;
  const roundingValueRaw = document.getElementById("inputWeightRoundingValue").value;
        let errorMsg = "";
        const fromValue = parseFloat(fromValueRaw);
        const roundingValue = parseInt(roundingValueRaw, 10);
        if (fromValueRaw === "" || isNaN(fromValue) || fromValue < 0) {
          errorMsg = "Please enter a valid non-negative weight value.";
        } else if (roundingValueRaw === "" || isNaN(roundingValue) || roundingValue < 0 || roundingValue > 10) {
          errorMsg = "Rounding value must be between 0 and 10.";
        }
        document.getElementById("errorMsg").textContent = errorMsg;
        const units = ["mg", "g", "kg", "t", "lb", "oz"];
        units.forEach(unit => {
          const outputId = "output_" + unit;
          if (errorMsg) {
            document.getElementById(outputId).textContent = "-";
          } else {
            try {
              const val = Weight_Conversion(fromUnit, unit, fromValue, roundingValue);
              document.getElementById(outputId).textContent = val;
            } catch (e) {
              document.getElementById(outputId).textContent = "Error";
            }
          }
        });
      }
    </script>
  </head>
  <body onload="weightConverter()">
    <div class="container" role="main">
      <h2>Weight Unit Converter</h2>
      <div id="errorMsg" class="error" aria-live="polite"></div>
      <form autocomplete="off" onsubmit="return false;">
        <div class="form-group">
          <label for="inputWeightUnit">Enter Weight:</label>
          <input
            id="inputWeightUnit"
            type="number"
            inputmode="decimal"
            min="0"
            step="any"
            value="0"
            placeholder="0"
            oninput="weightConverter()"
            aria-label="Weight value"
            required
          />
        </div>
        <div class="form-group">
          <label for="unitWeight">Unit:</label>
          <select id="unitWeight" name="unitWeight" onchange="weightConverter()" aria-label="Select unit">
            <option value="mg">mg</option>
            <option value="g">g</option>
            <option value="kg">kg</option>
            <option value="t">t</option>
            <option value="lb">lb</option>
            <option value="oz">oz</option>
          </select>
        </div>
        <div class="form-group">
          <label for="inputWeightRoundingValue">Decimal Places:</label>
          <input
            id="inputWeightRoundingValue"
            type="number"
            min="0"
            max="10"
            value="2"
            oninput="weightConverter()" onchange="weightConverter()"
            aria-label="Decimal places for result"
            required
          />
        </div>
      </form>
      <div class="results" aria-label="Conversion results">
        <div class="result-row"><span>Milli Gram:</span> <span id="output_mg">-</span></div>
        <div class="result-row"><span>Gram:</span> <span id="output_g">-</span></div>
        <div class="result-row"><span>Kilo Gram:</span> <span id="output_kg">-</span></div>
        <div class="result-row"><span>Tonne:</span> <span id="output_t">-</span></div>
        <div class="result-row"><span>Pound:</span> <span id="output_lb">-</span></div>
        <div class="result-row"><span>Ounce:</span> <span id="output_oz">-</span></div>
      </div>
    </div>
  </body>
  <script>
    if (window.UnitInfo && typeof window.UnitInfo.attachUnitInfoToSelects === 'function') {
      window.UnitInfo.attachUnitInfoToSelects(document);
    }
  </script>
</html>
